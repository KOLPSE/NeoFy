stages:
  - build

build:arch:
  stage: build
  tags:
    - arch
  before_script:
    - sudo rm -rf -- /tmp/neofy-pkg-{280,286,292,298,304,310,317,323} /tmp/neofy-srcinfo-{280,286,292,298,304,310,317,323}
    # ayatana-ido tiene que estar aqui y en depends= del PKGBUILD: desde
    # libayatana-appindicator 0.6.0-2 ese paquete ya no lo arrastra.
    - sudo pacman -S --noconfirm --needed
      gtk3 libayatana-appindicator libayatana-indicator ayatana-ido libsecret
      webkit2gtk-4.1
      base-devel sudo github-cli pacman-contrib xorg-server-xvfb xorg-xauth dbus
  script:
    - |
      set -euo pipefail
      mkdir -p dist
      for file in NeoFy-1.3.3-linux-x86_64.tar.gz NeoFy-1.3.3-linux-x86_64.AppImage; do
        curl -fsSL --retry 3 --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/253/artifacts/dist/$file" -o "dist/$file"
      done
      echo '40dac9d42c7950906d7e09f9145f76b8df31d29a95bc28aed62fdd4e97224ae6  dist/NeoFy-1.3.3-linux-x86_64.tar.gz' | sha256sum -c -
      echo '9b4dbad4aae53f6b51146cdf9074996f2f8313dea2e3ec9037e607dd0d07364e  dist/NeoFy-1.3.3-linux-x86_64.AppImage' | sha256sum -c -
    - |
      set -euo pipefail
      tar -xzf dist/NeoFy-*-linux-x86_64.tar.gz
      cd NeoFy-*-linux-x86_64
      fallo=0
      for bin in neofy librespot metadata-sidecar; do
        faltan="$(ldd "$bin" 2>&1 | grep 'not found' || true)"
        if [ -n "$faltan" ]; then
          echo "ERROR: $bin no encuentra:"; echo "$faltan"; fallo=1
        else
          echo "ok $bin"
        fi
      done
      for so in lib/*.so; do
        faltan="$(LD_LIBRARY_PATH="$PWD/lib" ldd "$so" 2>&1 | grep 'not found' || true)"
        if [ -n "$faltan" ]; then
          echo "ERROR: $so no encuentra:"; echo "$faltan"; fallo=1
        fi
      done
      [ "$fallo" = 0 ] || exit 1
      echo "Todos los binarios resuelven sus dependencias en Arch."
      cd "$CI_PROJECT_DIR"

    - |
      set -euo pipefail
      version="$(grep -oP "kVersion\s*=\s*'\K[^']+" lib/core/app_config.dart)"
      pkgver="$(grep -oP '^pkgver=\K.*' linux/packaging/PKGBUILD)"
      echo "kVersion=$version  pkgver=$pkgver"
      [ "$version" = "$pkgver" ] || {
        echo "ERROR: linux/packaging/PKGBUILD tiene pkgver=$pkgver pero kVersion es $version"
        exit 1
      }

    - |
      set -euo pipefail
      id builder >/dev/null 2>&1 || sudo useradd -m builder
      pkgdir="/tmp/neofy-pkg-${CI_JOB_ID:?}"
      mkdir -p "$pkgdir"
      cp linux/packaging/PKGBUILD "$pkgdir/"
      cp dist/NeoFy-*-linux-x86_64.tar.gz "$pkgdir/"
      sed -i 's|^source=.*|source=("$_tarball.tar.gz")|' "$pkgdir/PKGBUILD"
      sed -i "s|^sha256sums=.*|sha256sums=('SKIP')|" "$pkgdir/PKGBUILD"
      sudo chown -R builder "$pkgdir"
      sudo -u builder bash -c 'cd "$1" && makepkg -f --nodeps --noconfirm' _ "$pkgdir"
      mkdir -p dist
      cp "$pkgdir"/*.pkg.tar.zst dist/
      repo-add dist/neofy.db.tar.gz dist/neofy-bin-*.pkg.tar.zst
      rm -f dist/neofy.db dist/neofy.files
      cp -L dist/neofy.db.tar.gz dist/neofy.db
      cp -L dist/neofy.files.tar.gz dist/neofy.files
      ls -la dist/*.pkg.tar.zst

    - |
      set -euo pipefail
      srcdir="/tmp/neofy-srcinfo-${CI_JOB_ID:?}"
      sudo install -dm755 -o builder "$srcdir"
      sudo install -m644 -o builder linux/packaging/PKGBUILD "$srcdir/PKGBUILD"
      sudo -u builder bash -c 'cd "$1" && makepkg --printsrcinfo' _ "$srcdir"

    - |
      set -euo pipefail
      # La VM tiene índices de pacman antiguos; no se actualiza el sistema de
      # forma parcial. El runtime de esta prueba usa libmpv del AppImage.
      sudo pacman -U --nodeps --nodeps --noconfirm dist/neofy-bin-*.pkg.tar.zst
      test -x /opt/neofy/neofy          || { echo "ERROR: falta /opt/neofy/neofy"; exit 1; }
      test -x /opt/neofy/librespot      || { echo "ERROR: falta librespot"; exit 1; }
      test -x /opt/neofy/metadata-sidecar || { echo "ERROR: falta metadata-sidecar"; exit 1; }
      test -x /opt/neofy/yt-dlp         || { echo "ERROR: falta yt-dlp"; exit 1; }
      /opt/neofy/yt-dlp --version       || { echo "ERROR: yt-dlp no arranca"; exit 1; }
      test -d /opt/neofy/data           || { echo "ERROR: falta data/"; exit 1; }
      test -L /usr/bin/neofy            || { echo "ERROR: /usr/bin/neofy no es un enlace"; exit 1; }
      test -f /usr/share/applications/xyz.neogex.neofy.desktop || { echo "ERROR: falta el .desktop"; exit 1; }
      test -f /usr/share/icons/hicolor/256x256/apps/neofy.png  || { echo "ERROR: falta el icono"; exit 1; }
      [ "$(readlink -f /usr/bin/neofy)" = /opt/neofy/neofy ] || {
        echo "ERROR: el enlace apunta a $(readlink -f /usr/bin/neofy)"; exit 1; }
      echo "Instalado correctamente."

    - |
      set -euo pipefail
      export HOME="$CI_PROJECT_DIR/.ci-arch-home"
      mkdir -p "$HOME"
      image="$(realpath dist/NeoFy-*-linux-x86_64.AppImage)"
      chmod +x "$image"
      "$image" --appimage-extract 'usr/lib/*' >/dev/null
      mkdir -p deps
      curl -fsSL 'https://archive.ubuntu.com/ubuntu/pool/main/j/jackd2/libjack-jackd2-0_1.9.21~dfsg-3ubuntu3_amd64.deb' -o deps/jack.deb
      curl -fsSL 'https://archive.ubuntu.com/ubuntu/pool/main/p/pipewire/libpipewire-0.3-0t64_1.0.5-1ubuntu3.3_amd64.deb' -o deps/pipewire.deb
      echo '4fc5f4d0fbf2602df59bbed3ea504742bdcc7f899d7b32f6b2fd446ceb1fdf7d  deps/jack.deb' | sha256sum -c -
      echo '225786f83ecb81075b820652038e20f38ae8f72a9787b766c4e0aa1bd7dfead8  deps/pipewire.deb' | sha256sum -c -
      ar p deps/jack.deb data.tar.zst | tar --zstd -x -C deps
      ar p deps/pipewire.deb data.tar.zst | tar --zstd -x -C deps
      cp -L deps/usr/lib/x86_64-linux-gnu/libjack.so.0 "$CI_PROJECT_DIR/squashfs-root/usr/lib/libjack.so.0"
      cp -L deps/usr/lib/x86_64-linux-gnu/libpipewire-0.3.so.0 "$CI_PROJECT_DIR/squashfs-root/usr/lib/libpipewire-0.3.so.0"
      ls -l "$CI_PROJECT_DIR"/squashfs-root/usr/lib/libmpv* || true
      for lib in "$CI_PROJECT_DIR"/squashfs-root/usr/lib/libmpv*; do [ -e "$lib" ] && ldd "$lib" | grep -E 'not found|libmpv' || true; done
      find "$CI_PROJECT_DIR/squashfs-root/usr/lib" -maxdepth 1 \( -name '*jack*' -o -name '*pipewire*' \) -printf '%f\n'
      LD_LIBRARY_PATH="$CI_PROJECT_DIR/squashfs-root/usr/lib" ldd "$CI_PROJECT_DIR/squashfs-root/usr/lib/libmpv.so.2" | grep -E 'not found|GLIBC' || true
      app_libs="$CI_PROJECT_DIR/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}"
      pkill -f '^/usr/bin/neofy$' || true
      dbus-run-session -- xvfb-run -a env LD_LIBRARY_PATH="$app_libs" /usr/bin/neofy > /tmp/neofy.log 2>&1 &
      pid=$!
      trap 'kill "$pid" 2>/dev/null || true; pkill -f "^/usr/bin/neofy$" || true' EXIT
      sleep 25
      if ! kill -0 "$pid" 2>/dev/null; then
        echo "ERROR: neofy se ha caido durante el arranque"
        cat /tmp/neofy.log
        exit 1
      fi
      kill "$pid" 2>/dev/null || true
      pkill -f '^/usr/bin/neofy$' || true
      echo "Sigue viva pasados 25 s."
      if grep -q 'sin libmpv' /tmp/neofy.log; then
        echo "ERROR: la app ha arrancado sin la via libre: falta libmpv"
        echo "ERROR: revisa que 'mpv' siga en depends= de linux/packaging/PKGBUILD"
        cat /tmp/neofy.log
        exit 1
      fi
      echo "Y con la via libre operativa."

    - |
      set -euo pipefail
      sudo pacman -R --noconfirm neofy-bin
      test ! -e /opt/neofy || { echo "ERROR: quedan restos en /opt/neofy"; exit 1; }
      echo "Desinstala limpio."
    - |
      set -euo pipefail
      image="$CI_PROJECT_DIR/dist/NeoFy-1.3.3-linux-x86_64.AppImage"
      # El árbol anterior solo contiene las bibliotecas de la prueba nativa.
      rm -rf -- "$CI_PROJECT_DIR/squashfs-root"
      "$image" --appimage-extract >/dev/null
      cp -L deps/usr/lib/x86_64-linux-gnu/libjack.so.0 "$CI_PROJECT_DIR/squashfs-root/usr/lib/libjack.so.0"
      cp -L deps/usr/lib/x86_64-linux-gnu/libpipewire-0.3.so.0 "$CI_PROJECT_DIR/squashfs-root/usr/lib/libpipewire-0.3.so.0"
      chmod -R a+rX "$CI_PROJECT_DIR/squashfs-root"
      curl -fsSL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
      chmod +x appimagetool
      ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$CI_PROJECT_DIR/squashfs-root" "$CI_PROJECT_DIR/dist/neofy-corrected.AppImage"
      mv -f "$CI_PROJECT_DIR/dist/neofy-corrected.AppImage" "$image"
      chmod +x "$image"
      sha256sum "$image"
      set +e
      timeout 60s dbus-run-session -- xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$image" >appimage-arch.log 2>&1
      result=$?
      set -e
      if [ "$result" -ne 124 ] || grep -q 'sin libmpv' appimage-arch.log; then
        cat appimage-arch.log
        echo "El AppImage no superó la prueba en Arch (estado $result)." >&2
        exit 1
      fi
      echo 'El AppImage corregido arranca en Arch y encuentra libmpv.'
  artifacts:
    name: "neofy-arch-$CI_COMMIT_TAG"
    paths:
      - dist/*.pkg.tar.zst
      - dist/neofy.db*
      - dist/neofy.files*
      - dist/NeoFy-*-linux-x86_64.AppImage
    expire_in: 3 days
  after_script:
    - '[[ "$CI_JOB_ID" =~ ^[0-9]+$ ]] && sudo rm -rf -- "/tmp/neofy-pkg-$CI_JOB_ID" "/tmp/neofy-srcinfo-$CI_JOB_ID"'
