workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'

diag:windows:
  tags:
    - windows
  variables:
    GIT_STRATEGY: none
  script:
    - |
      Remove-Item -LiteralPath "C:\ci\flutter-3.44.6\sdk-ready" -Force -ErrorAction SilentlyContinue
      $toolsDir = 'C:\ci\flutter-3.44.6'
      $sdkRoot = Join-Path $toolsDir 'flutter'
      $archive = Join-Path $toolsDir 'flutter-reinstall.zip'
      $manifest = Invoke-RestMethod -TimeoutSec 45 'https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json'
      $release = $manifest.releases | Where-Object { $_.version -eq '3.44.6' -and $_.channel -eq 'stable' } | Select-Object -First 1
      & curl.exe --fail --location --retry 3 --connect-timeout 20 --max-time 600 --output $archive "https://storage.googleapis.com/flutter_infra_release/releases/$($release.archive)"
      if (Test-Path $sdkRoot) {
        $empty = Join-Path $env:TEMP "empty-$PID"
        New-Item -ItemType Directory -Force -Path $empty | Out-Null
        & robocopy $empty $sdkRoot /MIR /NFL /NDL /NJH /NJS /NC /NS /NP | Out-Null
        $global:LASTEXITCODE = 0
        Remove-Item -LiteralPath $empty -Force -Recurse -ErrorAction SilentlyContinue
        cmd /c "rmdir /s /q `"$sdkRoot`""
        $global:LASTEXITCODE = 0
      }
      & tar.exe -xf $archive -C $toolsDir
      Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
      [IO.File]::WriteAllText((Join-Path $toolsDir 'sdk-ready'), 'Flutter 3.44.6')
      & "$sdkRoot\bin\cache\dart-sdk\bin\dart.exe" --version
      Write-Host "reinstall dart exit=$LASTEXITCODE"
