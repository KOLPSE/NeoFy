[package]
name = "metadata-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

# Sidecar de metadatos.
#
# Existe por una restriccion concreta: estando en Modo Desarrollo, la Web API de
# Spotify devuelve 403 al pedir el contenido de una playlist que no sea tuya
# (y tambien en /v1/tracks?ids=). La sesion de librespot, en cambio, si puede
# leerlo, porque habla el protocolo interno igual que el cliente oficial.
#
# Este binario abre esa sesion con las credenciales que librespot ya dejo
# cacheadas y expone lo minimo por HTTP en localhost, con la misma forma de JSON
# que la Web API para que el cliente Flutter reutilice su parseo tal cual.

[dependencies]
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-protocol = "0.8.0"
protobuf = "3.7.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
