# Comprobación automática en cada push y cada pull request.
#
# Solo `analyze` y los tests. **No compila el instalador a propósito**: eso
# necesita compilar los dos sidecars de Rust (el `target/` pasa de 3 GB) e Inno
# Setup, y tardaría más de veinte minutos para algo que solo hace falta al
# publicar una versión. Las releases se generan en local con `tool\release.ps1`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llegan varios push seguidos, solo interesa el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    # Las dos plataformas, porque la app ya es de las dos. Hay tests que tocan
    # disco de verdad (la caché de carátulas) y antes daban por hecho un
    # %APPDATA%; ahora todos pasan por appDataDir()/cacheDir(), que resuelven
    # XDG en Linux, así que corren igual en los dos sitios. Correrlos solo en
    # uno dejaría pasar justo lo que este port puede romper.
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      # El Client ID va vacío en el repositorio a propósito. Si alguien lo
      # rellenara sin querer antes de un commit, se publicaría al mundo: mejor
      # que salte aquí que descubrirlo después.
      #
      # Basta con comprobarlo en una de las dos plataformas: es el mismo
      # fichero y el mismo commit.
      - name: Que no se cuele ningún Client ID
        if: matrix.so == 'windows-latest'
        shell: pwsh
        run: |
          $fuente = Get-Content lib/core/app_config.dart -Raw
          if ($fuente -notmatch "kDefaultClientId\s*=\s*''") {
            Write-Error "kDefaultClientId no está vacío: no publiques un Client ID."
            exit 1
          }
          Write-Host "kDefaultClientId vacío, correcto."
